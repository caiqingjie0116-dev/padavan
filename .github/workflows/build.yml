name: Custom Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Select router device'
        required: true
        default: 'CR660x'
        type: choice
        options:
          - 'CR660x'
      toolchain:
        description: 'Select compilation toolchain'
        required: true
        default: 'mipsel-linux-musl'
        type: choice
        options:
          - 'mipsel-linux-musl'
      release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Prepare Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gawk pkg-config gettext automake autoconf libtool libtool-bin gperf autopoint bison flex zlib1g-dev libgmp3-dev libmpfr-dev libmpc-dev libssl-dev lm-sensors libncurses5-dev python3-setuptools python3-pip python3-yaml upx-ucl p7zip-full curl

    - name: Pre-download LZMA to bypass 404 error
      run: |
        mkdir -p trunk/download
        curl -L -o trunk/download/lzma2409.7z https://proxy.mianao.info/https://github.com/caiqingjie0116-dev/padavan/releases/download/deps/lzma2409.7z || curl -L -o trunk/download/lzma2409.7z https://sources.openwrt.org/lzma2409.7z

    - name: Download and Inject EasyTier
      run: cd trunk/user/shared && mkdir -p easytier_tmp && cd easytier_tmp && curl -L -o easytier.zip https://github.com/EasyTier/EasyTier/releases/download/v2.6.4/easytier-linux-mipsel-v2.6.4.zip && unzip easytier.zip && cd easytier-linux-mipsel && mkdir -p ../../../../storage/rom/etc_ro/bin && cp easytier-core ../../../../storage/rom/etc_ro/bin/easytier-core && cp easytier-cli ../../../../storage/rom/etc_ro/bin/easytier-cli && chmod +x ../../../../storage/rom/etc_ro/bin/easytier-core && chmod +x ../../../../storage/rom/etc_ro/bin/easytier-cli && cd ../.. && rm -rf easytier_tmp

    - name: Run Build Script
      run: |
        cd trunk
        ./build_firmware.sh ${{ github.event.inputs.device }} ${{ github.event.inputs.toolchain }}

    - name: Organize Firmware Files
      run: |
        mkdir -p output
        find trunk/images/ -name "*.trx" -exec cp {} output/ \;
        echo "BUILD_TIME=$(date +'%Y%m%d%H%M')" >> $GITHUB_ENV

    - name: Upload Images to Release
      if: ${{ github.event.inputs.release == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: Padavan-CR660x-${{ env.BUILD_TIME }}
        files: output/*.trx
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
